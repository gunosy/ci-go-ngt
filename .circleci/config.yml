version: 2.1

executors:
  docker:
    working_directory: ~/workspace
    docker:
      - image: docker:18.03-git

commands:
  docker_build:
    description: Push image to registory
    parameters:
      repository:
        type: string
    steps:
      - run:
          command: docker build -t << parameters.repository >> .
  docker_push:
    description: Push image to registory
    parameters:
      repository:
        type: string
    steps:
      - run:
          command: |
            export TAG=`date +%Y.%m.%d`
            docker tag << parameters.repository >> << parameters.repository >>:${TAG}
            docker push << parameters.repository >>:${TAG}

jobs:
  build_and_push:
    executor: docker
    steps:
       # 1) shallow clone をやめて全履歴を取得できるようにする
      - checkout:
          fetch-depth: 0
      # 2) Docker を使うためのセットアップ
      - setup_remote_docker
      # 3) Docker Hub にログイン
      - run:
          name: Login to dockerhub
          command: docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"
      # 4) 直前のコミットから変更のあった Dockerfile のみをビルド＆プッシュする
      - run:
          name: Build and push docker image
          command: |
            CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD)
            DOCKERFILES=$(echo "$CHANGED_FILES" | grep "Dockerfile" || true)

            if [ -z "$DOCKERFILES" ]; then
              echo "No Dockerfile changes detected. Skipping build."
              exit 0
            fi

            echo "Changed Dockerfiles: ${DOCKERFILES}"

            for FILE in $DOCKERFILES; do
              TAG=$(dirname "$FILE")
              echo "Building ${TAG}..."
              docker build --pull -f $FILE . -t gunosy/ci-go-ngt:${TAG}
              docker push gunosy/ci-go-ngt:${TAG}
              if [ "$TAG" = "$(readlink latest)" ]; then
                docker tag gunosy/ci-go-ngt:${TAG} gunosy/ci-go-ngt:latest
                docker push gunosy/ci-go-ngt:latest
              fi
            done

workflows:
  build:
    jobs:
      - build_and_push:
          filters:
            branches:
              only: master
